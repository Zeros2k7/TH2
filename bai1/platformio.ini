[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*>
[env:vd1_delay]
build_src_filter = ${env.build_src_filter} +<vd1_dung_delay.cpp>
[env:vd2_millis]
build_src_filter = ${env.build_src_filter} +<vd2_non_blocking.cpp>
[env:vd3_so_sanh]
build_src_filter = ${env.build_src_filter} +<vd3_so_sanh_jitter.cpp>